x-service-env: &service-env
  DATABASE_URL: postgresql://worker:workerlocal@db:5432/jobs
  REDIS_URL: redis://redis:6379/0
  QUEUE_API_KEY: ${QUEUE_API_KEY:-local-demo-key}
services:
  db:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: worker, POSTGRES_PASSWORD: workerlocal, POSTGRES_DB: jobs}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [jobdb:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worker"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  api:
    build: .
    environment: *service-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
  worker:
    build: .
    command: python -m queue_app.worker
    environment: *service-env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    deploy:
      replicas: 2
volumes: {jobdb: {}}
